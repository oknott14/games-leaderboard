[project]
name = "games-leaderboard"
version = "0.1.0"
description = "Slack bot that tracks daily web-game results and posts configurable leaderboards"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "pydantic>=2",
    "pyyaml>=6",
    "slack-bolt>=1.21",
    "sqlalchemy>=2",
    "tzdata",
]

[project.scripts]
leaderboard = "leaderboard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leaderboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
